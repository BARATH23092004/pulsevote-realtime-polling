services:
  # 1. PulseVote Go Backend Web Service
  - type: web
    name: pulsevote-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: MONGO_URI
        sync: false # Provide your MongoDB Atlas URI
      - key: REDIS_URL
        sync: false # Provide your Upstash Redis TLS URI
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set to your live frontend URL

  # 2. PulseVote React Frontend (Static Site)
  - type: web
    name: pulsevote-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # e.g., https://pulsevote-backend.onrender.com/api
      - key: VITE_WS_URL
        sync: false # e.g., wss://pulsevote-backend.onrender.com/api
